services:
  # MongoDB Service
  mongodb:
    image: mongo:latest
    container_name: memed-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Redis Service
  redis:
    image: redis:alpine
    container_name: memed-redis
    restart: always
    ports:
      - "6379:6379"

  # Backend Express API
  backend:
    build:
      context: ./backend                     # <-- Points to root WLDD-final folder
      dockerfile: Dockerfile  # <-- Points to backend Dockerfile
    container_name: memed-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/memed
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key
    depends_on:
      - mongodb
      - redis

  # Frontend Next.js Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    container_name: memed-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo-data: